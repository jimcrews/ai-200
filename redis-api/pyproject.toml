[project]
name = "redis-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jim Crews", email = "crews.jim@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=3.28.0",
    "pydantic-settings>=2.15.0",
    "pymupdf4llm>=1.28.2",
    "redis>=8.1.0",
]

[project.scripts]
redis-api = "redis_api:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
src = ["src", "document_upload_pipeline"]

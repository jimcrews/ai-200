[project]
name = "fastapi-factory"
version = "0.1.0"
description = "Fast API using Application Factory"
readme = "README.md"
authors = [
    { name = "Jim Crews", email = "crews.jim@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
fastapi-factory = "fastapi_factory:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
